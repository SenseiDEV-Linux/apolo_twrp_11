name: Build OrangeFox R11 (apollo, Android 11)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # На раннере ~84 ГБ, из них занято ~40 ГБ. Чистим, чтобы вместить sync + out.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet \
                        /usr/local/lib/android \
                        /opt/ghc \
                        /opt/hostedtoolcache/CodeQL \
                        /usr/share/swift \
                        /usr/local/.ghcup
          sudo docker image prune -af >/dev/null 2>&1 || true
          sudo apt-get clean
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git git-lfs curl wget zip unzip ccache \
            build-essential bc bison flex g++-multilib gcc-multilib \
            libc6-dev-i386 lib32ncurses5-dev lib32z1-dev libncurses5 libtinfo5 \
            zlib1g-dev libssl-dev libxml2-utils xsltproc imagemagick schedtool \
            libxml-simple-perl libswitch-perl pngcrush \
            python2 python3
          sudo curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo \
            -o /usr/local/bin/repo
          sudo chmod a+rx /usr/local/bin/repo
          # Скрипты OrangeFox 11.x местом ещё Python 2.
          # Шим кладём в отдельный каталог и добавляем в PATH только в шаге сборки,
          # чтобы не сломать repo (ему нужен python3).
          sudo mkdir -p /opt/py2bin
          sudo ln -sf /usr/bin/python2 /opt/py2bin/python

      - name: Add swap
        run: |
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Sync sources (fox_11.0)
        run: |
          mkdir -p ~/OrangeFox_sync
          cd ~/OrangeFox_sync
          git clone https://gitlab.com/OrangeFox/sync.git
          # Запускать строго из sync/legacy - иначе не найдётся patches/*.diff
          cd sync/legacy
          ./orangefox_sync_legacy.sh --branch 11.0 --path "${{ github.workspace }}/fox_11.0"

      - name: Clone device tree
        run: |
          cd "${{ github.workspace }}/fox_11.0"
          mkdir -p device/xiaomi
          git clone https://github.com/SenseiDEV-Linux/apolo_twrp_11.git \
            -b android-11 device/xiaomi/apollo

      - name: Build recovery
        run: |
          cd "${{ github.workspace }}/fox_11.0"
          export PATH=/opt/py2bin:$PATH
          export ALLOW_MISSING_DEPENDENCIES=true
          export FOX_BUILD_DEVICE=apollo
          export LC_ALL=C
          export OF_DEFAULT_KEYMASTER_VERSION=4.0
          source build/envsetup.sh
          lunch twrp_apollo-eng
          mka adbd recoveryimage -j"$(nproc --all)"

      - name: Upload recovery image
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-apollo-R11
          path: |
            ${{ github.workspace }}/fox_11.0/out/target/product/apollo/recovery.img
            ${{ github.workspace }}/fox_11.0/out/target/product/apollo/*.zip
          if-no-files-found: error
