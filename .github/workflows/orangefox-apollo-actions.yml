name: Build OrangeFox R11 (apollo, Android 11)

# Credits to:
# https://github.com/TeamWin
# https://gitlab.com/OrangeFox
# https://github.com/azwhikaru for Recovery Builder Template
# And all Contributors in every repositories I used

on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        description: 'OrangeFox Manifest Branch (the sync script supports 16.0 / 14.1 / 12.1 only)'
        required: true
        default: '12.1'
        type: choice
        options:
        - 16.0
        - 14.1
        - 12.1
        - 11.0
      DEVICE_TREE:
        description: 'OrangeFox Device Tree (full https:// URL)'
        required: true
        default: 'https://github.com/SenseiDEV-Linux/apolo_twrp_11'
      DEVICE_TREE_BRANCH:
        description: 'Device Tree Branch (must exist! available: fox12.1-a17 / twrp / fbev1)'
        required: true
        default: 'android-11'
      DEVICE_PATH:
        description: 'Device Path (device/<vendor>/<codename>)'
        required: true
        default: 'device/xiaomi/apollo'
      DEVICE_NAME:
        description: 'Device Codename'
        required: true
        default: 'apollo'
      BUILD_TARGET:
        description: 'Build Target'
        required: true
        default: 'recovery'
        type: choice
        options:
        - boot
        - recovery
        - vendorboot
      EXTRA_REPOS:
        description: 'Optional. One repo per line: path|url|branch'
        required: false
        default: ''
      CCACHE_BUST:
        description: 'Bump this number to throw away the ccache cache and start cold'
        required: false
        default: '1'

jobs:
  build:
    name: Build OFR by ${{ github.actor }}
    runs-on: ubuntu-22.04
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # ---- ccache: the main speed-up on repeated builds ----
      USE_CCACHE: 1
      CCACHE_EXEC: /usr/bin/ccache
      CCACHE_MAXSIZE: 3G
      CCACHE_COMPRESS: 'true'
      CCACHE_COMPRESSLEVEL: 6
      CCACHE_NOHASHDIR: 'true'
      CCACHE_BASEDIR: /home/runner/work
      CCACHE_SLOPPINESS: 'time_macros,include_file_mtime,include_file_ctime,file_stat_matches'
      CCACHE_UMASK: '002'
    permissions:
      contents: write
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    # rokibhasansagar/slimhub_actions freed a lot but took 6.5 min;
    # jlumbroso/free-disk-space does the same big wins in ~1 min.
    - name: Free disk space (fast)
      uses: jlumbroso/free-disk-space@main
      with:
        # keep the tool-cache: the runner's node lives there and later
        # action steps (cache/artifact/release) need it
        tool-cache: false
        android: true
        dotnet: true
        haskell: true
        docker-images: true
        large-packages: false
        swap-storage: false

    - name: Disk report (before)
      run: df -h /

    - name: Swap Space
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 8

    - name: Build Environment
      run: |
        set -euo pipefail
        sudo apt install aria2 ccache zstd -y
        ccache --version | head -1

        # Fail here (in one second) instead of 4 minutes into the build if ccache is unusable.
        echo 'int main(void){return 0;}' > /tmp/cctest.c
        if CCACHE_DIR=/tmp/ccache-selftest ccache gcc -c /tmp/cctest.c -o /tmp/cctest.o; then
          echo "ccache self-test: OK"
          ccache --show-stats | head -5 || true
        else
          echo "::warning::ccache self-test FAILED - disabling ccache for this run"
          echo "USE_CCACHE=0" >> "$GITHUB_ENV"
        fi

        git clone https://gitlab.com/OrangeFox/misc/scripts.git -b master
        cd scripts
        sudo bash setup/android_build_env.sh

    - name: Set-up Manifest
      run: |
        set -euo pipefail
        mkdir -p ${GITHUB_WORKSPACE}/OrangeFox
        cd ${GITHUB_WORKSPACE}/OrangeFox
        git config --global user.name "${{ github.actor }}"
        git config --global user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
        git clone https://gitlab.com/OrangeFox/sync.git -b master
        cd sync/legacy
        ./orangefox_sync_legacy.sh --branch ${{ inputs.MANIFEST_BRANCH }} --path ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}

    - name: Clone Device Tree
      run: |
        set -euo pipefail
        TREE="${{ inputs.DEVICE_TREE }}"
        BRANCH="${{ inputs.DEVICE_TREE_BRANCH }}"
        DEST="${{ inputs.DEVICE_PATH }}"
        MANIFEST_DIR="${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}"

        echo "=== repo:   $TREE"
        echo "=== branch: $BRANCH"
        echo "=== dest:   $MANIFEST_DIR/$DEST"
        echo "=== branches that really exist in that repo:"

        if ! git ls-remote --heads "$TREE" 2>/dev/null \
             | sed -e 's#^[^\t]*\trefs/heads/##' | sort > /tmp/tree-branches.txt; then
          echo "::error::Cannot read $TREE - wrong URL, repo deleted, or it is private (needs a token in the clone URL)."
          exit 1
        fi
        sed 's/^/    - /' /tmp/tree-branches.txt

        if ! grep -Fxq "$BRANCH" /tmp/tree-branches.txt; then
          echo "::error::Branch '$BRANCH' does not exist in $TREE. Use one of the branches printed above."
          exit 1
        fi

        cd "$MANIFEST_DIR"
        rm -rf "./$DEST"
        git clone --depth 1 "$TREE" -b "$BRANCH" "./$DEST"
        cd "./$DEST"
        echo "COMMIT_ID=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

    # .repo is only needed by the sync itself; the build never touches it.
    # Dropping it returns ~8-12 GB, which is exactly what we were short of.
    - name: Reclaim .repo space
      run: |
        set -euo pipefail
        MANIFEST_DIR="${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}"
        sudo rm -rf "$MANIFEST_DIR/.repo" "$MANIFEST_DIR/../sync/.git" || true
        df -h / | tail -1
        echo "free_gb=$(df -BG --output=avail / | tail -1 | tr -dc 0-9)" >> "$GITHUB_ENV"

    - name: Disk guard
      run: |
        set -euo pipefail
        FREE=$(df -BG --output=avail / | tail -1 | tr -dc 0-9)
        echo "Free space before build: ${FREE} GB"
        if [ "$FREE" -lt 20 ]; then
          echo "::error::Only ${FREE} GB free - the build needs ~35 GB and will die with 'No space left on device' / 'Read-only file system'."
          exit 1
        fi

    - name: Extra repos (optional)
      if: inputs.EXTRA_REPOS != ''
      run: |
        set -euo pipefail
        cd "${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}"
        while IFS='|' read -r P URL B; do
          P="$(echo "${P:-}" | xargs)"; URL="$(echo "${URL:-}" | xargs)"; B="$(echo "${B:-}" | xargs)"
          [ -z "$P" ] && continue
          case "$P" in \#*) continue ;; esac
          echo "=== overlay $P  <-  $URL (${B:-default branch})"
          rm -rf "$P"
          if [ -n "$B" ]; then
            git clone --depth 1 -b "$B" "$URL" "$P"
          else
            git clone --depth 1 "$URL" "$P"
          fi
        done <<< "${{ inputs.EXTRA_REPOS }}"

    # ccache is restored by prefix and saved under a unique key, so even a run that
    # fails half-way leaves a usable cache for the next attempt.
    - name: Restore ccache
      uses: actions/cache/restore@v4
      with:
        path: ${{ github.workspace }}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}/out/ccache
        key: ccache-${{ runner.os }}-fox${{ inputs.MANIFEST_BRANCH }}-${{ inputs.DEVICE_NAME }}-${{ inputs.DEVICE_TREE_BRANCH }}-${{ inputs.BUILD_TARGET }}-bust${{ inputs.CCACHE_BUST }}-run-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          ccache-${{ runner.os }}-fox${{ inputs.MANIFEST_BRANCH }}-${{ inputs.DEVICE_NAME }}-${{ inputs.DEVICE_TREE_BRANCH }}-${{ inputs.BUILD_TARGET }}-bust${{ inputs.CCACHE_BUST }}-run-
          ccache-${{ runner.os }}-fox${{ inputs.MANIFEST_BRANCH }}-${{ inputs.DEVICE_NAME }}-

    - name: Building OrangeFox
      run: |
        cd "${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}"
        LOG="${GITHUB_WORKSPACE}/of-build.log"
        export ALLOW_MISSING_DEPENDENCIES=true

        # soong runs every compile step inside an nsjail sandbox where "/" is
        # mounted READ-ONLY; only out/, /tmp and dist/ are bind-mounted read-write.
        # That is why CCACHE_DIR=$HOME/.ccache died with
        #   ccache: error: Failed to create directory /home/runner/.ccache/tmp:
        #   Read-only file system
        # AOSP's recommended fix: keep the cache inside out/.
        export CCACHE_DIR="$PWD/out/ccache"
        export CCACHE_EXEC=$(which ccache)
        mkdir -p "$CCACHE_DIR"
        ccache --max-size=${CCACHE_MAXSIZE} >/dev/null 2>&1 || true

        echo "=== ccache dir: $CCACHE_DIR ==="
        echo "=== free space / memory before build ==="
        df -h / | tail -1; df -i / | tail -1; free -h | head -3

        # IMPORTANT: envsetup.sh and lunch() MUST run in this very shell.
        # Never pipe them ("source ... | tee") - the right side of a pipeline is a
        # subshell, so the functions/env vars (lunch, mka, TARGET_PRODUCT) are lost
        # and you get "line N: lunch: command not found".
        set +e
        source build/envsetup.sh >> "$LOG" 2>&1
        set -e

        if ! type lunch >/dev/null 2>&1; then
          echo "::error::build/envsetup.sh did not define lunch() - envsetup failed. Tail of its output:"
          tail -n 20 "$LOG"
          exit 1
        fi

        lunch twrp_${{ inputs.DEVICE_NAME }}-eng >> "$LOG" 2>&1
        tail -n 15 "$LOG"

        # NOTE: no 'make clean' here - the workspace is always fresh, so it only
        # parsed the whole build system for a couple of minutes and did nothing.
        set -o pipefail
        set +e
        time mka ${{ inputs.BUILD_TARGET }}image 2>&1 | tee -a "$LOG"
        RC=$?

        # Belt and braces: if ccache still cannot write, finish the build with the
        # cache switched off instead of losing 40 minutes of compilation.
        if [ "$RC" -ne 0 ] && grep -q "ccache: error" "$LOG"; then
          echo "::warning::ccache cannot write inside the build sandbox - continuing with CCACHE_DISABLE=1 (slower, but the build completes)"
          export CCACHE_DISABLE=1
          time mka ${{ inputs.BUILD_TARGET }}image 2>&1 | tee -a "$LOG"
          RC=$?
        fi
        set -e

        ccache --show-stats 2>/dev/null | head -20 || true
        exit "$RC"

    # Publicly visible annotations: this is how a failure can be diagnosed
    # even when the job log itself needs a GitHub login.
    - name: Failure report
      if: failure()
      run: |
        set +e
        echo "=== disk ==="; df -h /
        echo "=== memory / swap ==="; free -h
        echo "=== oom kills ==="; sudo dmesg 2>/dev/null | grep -iE "out of memory|killed process|oom" | tail -5

        # these two lines are the ones that matter, keep them public
        echo "::error::disk: $(df -h / | tail -1) | inodes: $(df -i / | tail -1)"
        echo "::error::memory: $(free -h | sed -n 2p)"

        LOG="${GITHUB_WORKSPACE}/of-build.log"
        if [ ! -f "$LOG" ]; then
          echo "::error::No build log was produced - the step died before mka started (envsetup/lunch stage)."
          exit 0
        fi

        if grep -q "No space left on device" "$LOG"; then
          echo "::error::OUT OF DISK SPACE: $(grep -m1 'No space left on device' "$LOG")"
        fi
        if grep -q "Read-only file system" "$LOG"; then
          echo "::error::READ-ONLY WRITE TARGET: $(grep -m1 'Read-only file system' "$LOG") - inside the soong nsjail only out/, /tmp and dist/ are writable"
        fi
        if grep -q "command not found" "$LOG"; then
          echo "::error::envsetup.sh did not load: $(grep -m1 'command not found' "$LOG")"
        fi

        echo "=== last 50 log lines ==="
        tail -50 "$LOG"

        echo "=== publishing error lines as annotations ==="
        mapfile -t LINES < <(grep -nE "error:|fatal:|FAILED:|ninja: build stopped|No space left|Killed|undefined reference|cannot find -l|Permission denied|not found" "$LOG" | tail -12)
        if [ "${#LINES[@]}" -eq 0 ]; then
          echo "::error::mka failed without a recognisable error line - download artifact of-build-log"
        else
          for l in "${LINES[@]}"; do
            echo "::error::${l:0:900}"
          done
        fi
        exit 0

    - name: Upload build log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: of-build-log-${{ github.run_attempt }}
        path: of-build.log
        if-no-files-found: ignore
        retention-days: 14

    - name: Save ccache (even after a failure)
      if: always()
      uses: actions/cache/save@v4
      with:
        path: ${{ github.workspace }}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}/out/ccache
        key: ccache-${{ runner.os }}-fox${{ inputs.MANIFEST_BRANCH }}-${{ inputs.DEVICE_NAME }}-${{ inputs.DEVICE_TREE_BRANCH }}-${{ inputs.BUILD_TARGET }}-bust${{ inputs.CCACHE_BUST }}-run-${{ github.run_id }}-${{ github.run_attempt }}

    - name: Set Release Properties
      if: success()
      run: |
        echo "BUILD_DATE=$(TZ=Asia/Manila date +%Y%m%d)" >> $GITHUB_ENV
        DEVICE_TREE_URL="${{ inputs.DEVICE_TREE }}"
        if [[ "${DEVICE_TREE_URL}" == *.git ]]; then
          DEVICE_TREE_URL="${DEVICE_TREE_URL%.git}"
        fi
        echo "DEVICE_TREE_URL=${DEVICE_TREE_URL}" >> $GITHUB_ENV

    - name: Upload to Release
      if: success()
      uses: softprops/action-gh-release@v2
      with:
        files: |
          OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}/out/target/product/${{ inputs.DEVICE_NAME }}/OrangeFox*.img
          OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}/out/target/product/${{ inputs.DEVICE_NAME }}/OrangeFox*.zip
        name: OrangeFox Recovery for ${{ inputs.DEVICE_NAME }} // ${{ env.BUILD_DATE }}
        tag_name: ${{ github.run_id }}
        body: |
          ## OrangeFox Recovery Build - Unofficial
          Build: fox_${{ inputs.MANIFEST_BRANCH }}
          Device: [Device Tree/Branch](${{ env.DEVICE_TREE_URL }}/tree/${{ inputs.DEVICE_TREE_BRANCH }})
          Commit: Most recent [commit](${{ env.DEVICE_TREE_URL }}/commit/${{ env.COMMIT_ID }}) during building.
